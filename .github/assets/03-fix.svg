<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">The same card, fixed</title>
  <desc id="d">One pricing card changes from the default AI look into the Pineapple version: the purple glow, gradient text, icon tile, emoji and vague terms give way to one blue action color, the full price per month and per year, plain trial terms, and a button that says Start free trial.</desc>
  <style>
    .hd { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F5F5F7; }
    .tx { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .g  { fill: #86868B; }
    .in { animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(16px); } }
    /* Resting state is the fixed card. The animation swings AI → Pineapple → AI → Pineapple, then stays. */
    .ai { opacity: 0; animation: aiOut 3600ms cubic-bezier(0.45, 0, 0.2, 1) 3 alternate both; }
    .pp { opacity: 1; animation: ppIn 3600ms cubic-bezier(0.45, 0, 0.2, 1) 3 alternate both; }
    .s2 { animation-delay: 120ms; } .s3 { animation-delay: 240ms; } .s4 { animation-delay: 360ms; }
    @keyframes aiOut { 0%, 45% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes ppIn  { 0%, 45% { opacity: 0; } 70%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="675" rx="28" fill="#000"/>
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C084FC"/><stop offset="0.55" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <text class="hd ai" x="600" y="84" text-anchor="middle" font-size="34" style="fill:#86868B">The default AI look</text>
  <text class="hd pp" x="600" y="84" text-anchor="middle" font-size="34" style="fill:#86868B">With Pineapple</text>

  <g class="ai"><ellipse cx="600.0" cy="408" rx="230" ry="260" fill="#7C3AED" opacity="0.5" filter="url(#glow)"/>
    <rect x="400" y="128" width="400" height="516" rx="30" fill="#120E24" stroke="url(#gb)" stroke-width="2"/></g>
  <g class="pp"><rect x="400" y="128" width="400" height="516" rx="30" fill="#FFFFFF"/></g>

  <g class="tx ai s1">
    <text x="436" y="178" font-size="15" font-weight="700" letter-spacing="2.6" fill="#C4B5FD">✦ MOST POPULAR</text>
    <rect x="436" y="198" width="56" height="56" rx="15" fill="url(#gt)"/>
    <path d="M468,208 l-13,20 h10 l-4,15 l14,-21 h-10 z" fill="#fff"/>
    <text x="436" y="308" font-size="44" font-weight="800" fill="url(#gx)">Pro Plan</text></g>
  <g class="hd pp s1"><text x="440" y="192" font-size="30" font-weight="600" fill="#1D1D1F">Pro</text></g>

  <g class="tx ai s2"><text x="436" y="376" font-size="60" font-weight="800" fill="#fff">$8<tspan font-size="22" font-weight="500" fill="#8B8FA3" dx="4">/mo</tspan></text>
    <text x="436" y="412" font-size="18" fill="#8B8FA3">Perfect for power users 🚀</text></g>
  <g class="hd pp s2"><text x="440" y="278" font-size="74" font-weight="600" letter-spacing="-1.6" fill="#1D1D1F">$8<tspan font-size="22" font-weight="400" letter-spacing="0" fill="#6E6E73" dx="8">/ month</tspan></text>
    <text x="440" y="316" font-size="19" fill="#6E6E73">or $80 a year, save 17%</text></g>

  <g class="tx ai s3" font-size="19" fill="#E5E7EB"><text x="436" y="462">✅  Unlimited notes</text><text x="436" y="498">✅  Sync across devices</text><text x="436" y="534">✅  Version history</text></g>
  <g class="hd pp s3" font-size="20" style="fill:#1D1D1F"><path d="M440,374 l7,7 l14,-16" fill="none" stroke="#0088FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="476" y="382">Unlimited notes</text><path d="M440,414 l7,7 l14,-16" fill="none" stroke="#0088FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="476" y="422">Sync across devices</text><path d="M440,454 l7,7 l14,-16" fill="none" stroke="#0088FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="476" y="462">Version history</text></g>

  <g class="tx ai s4"><rect x="436" y="560" width="328" height="52" rx="26" fill="url(#gt)"/>
    <text x="600.0" y="593" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">Get Started →</text>
    <text x="600.0" y="632" font-size="13" fill="#5E6177" text-anchor="middle">Try it free for 14 days!*</text></g>
  <g class="hd pp s4"><rect x="440" y="506" width="320" height="56" rx="28" fill="#1E6EF4"/>
    <text x="600.0" y="541" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">Start free trial</text>
    <text x="600.0" y="594" font-size="17" fill="#6E6E73" text-anchor="middle">Free for 14 days, then $8/month.</text>
    <text x="600.0" y="618" font-size="17" fill="#6E6E73" text-anchor="middle">Cancel anytime in Settings.</text></g>
</svg>

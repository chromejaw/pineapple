<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" role="img" aria-labelledby="title desc">
  <title id="title">Every value has a reason</title>
  <desc id="desc">Eight tiles of numbers from the skill. Touch targets: 44 by 44 points; a 24-point icon gets a 44-point tappable area. Text contrast: 4.5 to 1, and Apple's own light secondary gray is only 3.4 to 1. Keyboard actions: 0 milliseconds of animation. Springs: damping ratio 1.0 by default, bounce only after a flick. Tracking at 17 points: minus 0.43. Momentum: deceleration rate 0.998. 16 AI-look tells. 51 audit checks in 8 phases.</desc>
  <style>
    .lab  { font: 600 21px 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6E6E73; }
    .num  { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: -2px; fill: #1D1D1F; }
    .desc { font: 400 20px 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6E6E73; }
    .acc  { font: 600 26px 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1A66E0; }
  </style>

  <rect x="0.0" y="0" width="592.0" height="516" rx="28" fill="#F5F5F7"/>
  <text class="lab" x="40.0" y="62">Touch targets</text>
  <text class="num" x="36.0" y="196" font-size="132">44×44<tspan font-size="44" letter-spacing="0" dx="10">pt</tspan></text>
  <text class="desc" x="40.0" y="252">The minimum for anything people tap.</text>
  <text class="desc" x="40.0" y="282">Small icons get an invisible hit area.</text>
  <text class="acc" x="40.0" y="384">24 pt</text><text class="desc" x="120.0" y="384">what you see</text>
  <text class="acc" x="40.0" y="428">44 pt</text><text class="desc" x="120.0" y="428">what your thumb gets</text>
  <rect x="400.0" y="306" width="132" height="132" rx="26" fill="none" stroke="#0088FF" stroke-width="2.5" stroke-dasharray="7 7"/>
  <circle cx="466.0" cy="372" r="36" fill="#0088FF"/>
  <path d="M466.0,354 v36 M448.0,372 h36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <rect x="608.0" y="0" width="288.0" height="250" rx="28" fill="#F5F5F7"/><text class="lab" x="640.0" y="54">Text contrast</text><text class="num" x="638.0" y="140" font-size="76">4.5:1</text><text class="desc" x="640.0" y="184">Apple’s own light gray</text><text class="desc" x="640.0" y="212">is 3.4:1. We fix it.</text>
  <rect x="912.0" y="0" width="288.0" height="250" rx="28" fill="#F5F5F7"/><text class="lab" x="944.0" y="54">Keyboard actions</text><text class="num" x="942.0" y="140" font-size="76">0 ms</text><text class="desc" x="944.0" y="184">of animation on what</text><text class="desc" x="944.0" y="212">you do all day.</text>

  <rect x="608.0" y="266" width="592.0" height="250" rx="28" fill="#F5F5F7"/>
  <text class="lab" x="640.0" y="320">Springs</text>
  <text class="num" x="638.0" y="406" font-size="76">ζ = 1.0</text>
  <text class="desc" x="640.0" y="450">Critically damped by default.</text>
  <text class="desc" x="640.0" y="478">Bounce only after a flick.</text>

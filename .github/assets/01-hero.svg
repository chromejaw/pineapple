<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Pineapple</title>
  <desc id="d">A pineapple app icon above the words: Pineapple. Apple’s design philosophy, for your agent.</desc>
  <style>
    .hd { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F5F5F7; }
    .tx { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .g  { fill: #86868B; }
    .in { animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(16px); } }
    .icon { transform-box: fill-box; transform-origin: 50% 60%; animation: rise 1100ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .leaf { transform-origin: 0 0; animation: sprout 900ms cubic-bezier(0.32, 0.72, 0, 1) both; }
    .shine { opacity: 0; animation: shine 1500ms cubic-bezier(0.45, 0, 0.2, 1) 1000ms both; }
    .word { animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) 420ms both; }
    .tag  { animation: in 900ms cubic-bezier(0.23, 1, 0.32, 1) 560ms both; }
    @keyframes rise   { from { opacity: 0; transform: translateY(28px) scale(0.94); } }
    @keyframes sprout { from { opacity: 0; transform: scale(0.55, 0.12); } }
    @keyframes shine  { 0% { opacity: 0; transform: translateX(-150px); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateX(150px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
